modLoader = "javafml"
loaderVersion = "*"
license = "GPL-3.0-or-later"

[[mods]]
modId = "mcav_mcv2"
version = "${version}"
displayName = "MCAV MCV2 Client"
authors = "Brandon Li"
description = '''
Decodes MCAV's MCV2 screens under Iris 1.11.7 shader packs. With another Iris version it tells MCAV servers that a shader pack is on, so they show you the dithered maps while it is.
'''

[[mixins]]
config = "mcav-mcv2.mixins.json"

[[dependencies.mcav_mcv2]]
modId = "neoforge"
type = "required"
versionRange = "[26.3.0.43-beta,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mcav_mcv2]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,26.4)"
ordering = "NONE"
side = "CLIENT"
