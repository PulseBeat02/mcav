# the output of the browser helpers is logged at debug level, so a failing browser test shows what the helper said
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.me.brandonli.mcav.browser.HelperSession=debug
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
