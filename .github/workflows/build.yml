name: Build

on:
  push:
    branches: [ rewrite, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ rewrite, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-common
            os: ubuntu-24.04
            tasks: :mcav-common:build
          - name: linux-x64-bukkit
            os: ubuntu-24.04
            tasks: :mcav-bukkit:build -x :mcav-bukkit:variableNames
          - name: linux-x64
            os: ubuntu-24.04
            tasks: :mcav-plugin:build :mcav-mod:build :mcav-browser:build
          - name: linux-x64-more
            os: ubuntu-24.04
            writes-dependencies: true
            tasks: >-
              build :mcav-bukkit:variableNames -x :mcav-common:build -x :mcav-bukkit:build -x :mcav-plugin:build
              -x :mcav-mod:build -x :mcav-browser:build
          - name: windows-x64
            os: windows-2025
            writes-dependencies: true
            tasks: &assemble-and-os-gated-tests >-
              assemble
              :mcav-lwjgl:test --rerun --tests '*.GlTextureFilterTest'
              :mcav-vm:test --rerun --tests '*.QemuVmPlayerTest' --tests '*.VmProcessTest' --tests '*.ExecutableFinderTest'
          - name: windows-x64-tests
            os: windows-2025
            tasks: &os-gated-tests >-
              :mcav-common:test --rerun
              --tests '*.capability.installer.vlc.VlcInstallerTest'
              --tests '*.capability.installer.vlc.discovery.PlatformDiscoveryStrategiesTest'
              --tests '*.capability.installer.vlc.discovery.DirectoryProviderDiscoveryStrategyTest'
              --tests '*.capability.installer.vlc.installation.ManualInstallationStrategyTest'
              --tests '*.capability.installer.vlc.NativeVlcDiscoveryTest'
              --tests '*.capability.installer.ytdlp.YtdlpInstallerTest'
              --tests '*.utils.os.PlatformTest'
              --tests '*.media.player.multimedia.vlc.VlcPlayerIntegrationTest'
              --tests '*.media.player.pipeline.filter.audio.DirectAudioOutputTest'
              --tests '*.media.player.pipeline.filter.video.FaceDetectionFilterTest'
              --tests '*.media.player.multimedia.cv.OpenCvPlayersTest'
          - name: macos-arm64
            os: macos-15
            writes-dependencies: true
            tasks: *assemble-and-os-gated-tests
          - name: macos-arm64-tests
            os: macos-15
            tasks: *os-gated-tests

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - &set-up-gradle
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: caches/modules-2

      - &compile-only-build-cache
        name: Serve only compile tasks from the build cache
        shell: bash
        run: |
          init="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init"
          cat > "$init/compile-only-build-cache.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  def type = task.getClass().name
                  def compile = task instanceof AbstractCompile || type.startsWith('org.jetbrains.kotlin.gradle.tasks.') ||
                      type.startsWith('org.gradle.kotlin.dsl.') || type.startsWith('me.brandonli.mcav.gradle.BuildMcv2Natives')
                  if (!compile) {
                      task.outputs.doNotCacheIf('CI serves only compile tasks from the build cache') { true }
                  }
              }
          }
          EOF

      - &restore-dependencies
        name: Restore the Gradle dependency cache
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2
          key: gradle-modules-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-modules-${{ runner.os }}-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb qemu-system-x86 qemu-utils libgtk2.0-0t64 mesa-utils libgl1-mesa-dri \
            libva2 libva-drm2 libx11-xcb1 libxcb-shm0 libasound2t64 libpulse0 libsndfile1 libmp3lame0 \
            libmpg123-0t64 libvorbisenc2 libopus0 libvlc-dev libvlccore-dev vlc-plugin-base vlc-plugin-video-output

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh ./gradlew --console=plain clean ${{ matrix.tasks }} -Pmcav.networkTests=true --no-parallel --continue

      - name: Build and run the OS-gated tests
        if: runner.os != 'Linux'
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          printf 'allprojects { tasks.withType(Test).configureEach { forkEvery = 1 } }\n' > "$RUNNER_TEMP/fork-every.gradle"
          sh ./gradlew --console=plain --init-script "$RUNNER_TEMP/fork-every.gradle" --no-parallel --continue \
            -Pmcav.networkTests=true -Pmcav.coverage=false ${{ matrix.tasks }}

      - &count-test-cases
        name: Count the test cases
        if: always()
        continue-on-error: true
        shell: java --source 25 {0}
        run: |
          import java.io.IOException;
          import java.io.InputStream;
          import java.nio.file.FileSystems;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.PathMatcher;
          import java.nio.file.attribute.BasicFileAttributes;
          import java.util.List;
          import java.util.Map;
          import java.util.TreeMap;
          import java.util.stream.Stream;
          import javax.xml.stream.XMLInputFactory;
          import javax.xml.stream.XMLStreamException;
          import javax.xml.stream.XMLStreamReader;

          final class TestCaseCounts {

            private static final Path WORKSPACE = Path.of("");

            private static final int RESULT_DEPTH = 5;
            private static final int PROJECT_INDEX = 0;
            private static final int BUILD_INDEX = 1;
            private static final int TASK_INDEX = 3;

            private static final Path RESULTS_DIRECTORY = Path.of("build", "test-results");
            private static final PathMatcher RESULT_FILE = FileSystems.getDefault().getPathMatcher("glob:TEST-*.xml");

            private static final List<String> COUNT_ATTRIBUTES = List.of("tests", "skipped", "failures", "errors");
            private static final String COUNTS = "tests=%d skipped=%d failures=%d errors=%d";

            private static final XMLInputFactory XML = XMLInputFactory.newFactory();

            void main() throws Exception {
              final Map<String, long[]> tasks = new TreeMap<>();
              for (final Path file : this.findResultFiles()) {
                final String task = ":%s:%s".formatted(file.getName(PROJECT_INDEX), file.getName(TASK_INDEX));
                final long[] suite = this.readCounts(file);
                IO.println("test-suite %s %s %s %s".formatted(task, file.getFileName(), this.format(suite), this.readTime(file)));
                final long[] counts = tasks.computeIfAbsent(task, key -> new long[COUNT_ATTRIBUTES.size()]);
                for (int i = 0; i < counts.length; i++) {
                  counts[i] += suite[i];
                }
              }

              final long[] total = new long[COUNT_ATTRIBUTES.size()];
              tasks.forEach((task, counts) -> {
                IO.println("test-count %s %s".formatted(task, this.format(counts)));
                for (int i = 0; i < total.length; i++) {
                  total[i] += counts[i];
                }
              });
              IO.println("test-count total tasks=%d %s".formatted(tasks.size(), this.format(total)));
            }

            private long[] readCounts(final Path file) throws IOException, XMLStreamException {
              try (final InputStream input = Files.newInputStream(file)) {
                final XMLStreamReader suite = XML.createXMLStreamReader(input);
                suite.nextTag();
                final long[] counts = new long[COUNT_ATTRIBUTES.size()];
                for (int i = 0; i < counts.length; i++) {
                  counts[i] = Long.parseLong(suite.getAttributeValue(null, COUNT_ATTRIBUTES.get(i)));
                }
                suite.close();
                return counts;
              }
            }

            private String readTime(final Path file) throws IOException, XMLStreamException {
              try (final InputStream input = Files.newInputStream(file)) {
                final XMLStreamReader suite = XML.createXMLStreamReader(input);
                suite.nextTag();
                final String time = "time=%s at=%s".formatted(suite.getAttributeValue(null, "time"), suite.getAttributeValue(null, "timestamp"));
                suite.close();
                return time;
              }
            }

            private List<Path> findResultFiles() throws IOException {
              try (final Stream<Path> paths = Files.find(WORKSPACE, RESULT_DEPTH, this::isResultFile)) {
                return paths.sorted().toList();
              }
            }

            private boolean isResultFile(final Path path, final BasicFileAttributes attributes) {
              if (path.getNameCount() != RESULT_DEPTH) {
                return false;
              }

              final Path directory = path.subpath(BUILD_INDEX, TASK_INDEX);
              final Path fileName = path.getFileName();
              return directory.equals(RESULTS_DIRECTORY) && RESULT_FILE.matches(fileName);
            }

            private String format(final long[] counts) {
              return COUNTS.formatted(counts[0], counts[1], counts[2], counts[3]);
            }
          }

      - &annotate-failed-test-cases
        name: Annotate the failed test cases
        if: failure()
        shell: java --source 25 {0}
        run: |
          import java.io.IOException;
          import java.nio.file.FileSystems;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.PathMatcher;
          import java.nio.file.attribute.BasicFileAttributes;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Optional;
          import java.util.stream.Stream;
          import javax.xml.parsers.DocumentBuilder;
          import javax.xml.parsers.DocumentBuilderFactory;
          import javax.xml.parsers.ParserConfigurationException;
          import org.w3c.dom.Document;
          import org.w3c.dom.Element;
          import org.w3c.dom.NodeList;
          import org.xml.sax.SAXException;

          final class FailedTestAnnotations {

            private static final Path WORKSPACE = Path.of("");

            private static final int RESULT_DEPTH = 5;
            private static final int PROJECT_INDEX = 0;
            private static final int BUILD_INDEX = 1;
            private static final int TASK_INDEX = 3;

            private static final Path RESULTS_DIRECTORY = Path.of("build", "test-results");
            private static final PathMatcher RESULT_FILE = FileSystems.getDefault().getPathMatcher("glob:TEST-*.xml");

            private static final String FAILURE_TAG = "failure";
            private static final String CLASS_ATTRIBUTE = "classname";
            private static final String NAME_ATTRIBUTE = "name";
            private static final String MESSAGE_ATTRIBUTE = "message";
            private static final String TYPE_ATTRIBUTE = "type";

            private static final String FRAME_PREFIX = "at ";
            private static final String SUPPRESSED_PREFIX = "Suppressed: ";
            private static final String CAUSE_PREFIX = "Caused by: ";
            private static final String MEMBER_SEPARATOR = ".";
            private static final String LINE_SEPARATOR = "\n";

            private static final int ANNOTATIONS_PER_STEP = 10;

            void main() throws IOException {
              final List<Path> files = this.findResultFiles();
              final List<String> annotations = new ArrayList<>();
              for (final Path file : files) {
                final List<String> fileAnnotations = this.annotateFile(file);
                annotations.addAll(fileAnnotations);
              }

              this.printAnnotations(files, annotations);
            }

            private List<Path> findResultFiles() throws IOException {
              try (final Stream<Path> paths = Files.find(WORKSPACE, RESULT_DEPTH, this::isResultFile)) {
                return paths.sorted().toList();
              }
            }

            private boolean isResultFile(final Path path, final BasicFileAttributes attributes) {
              if (path.getNameCount() != RESULT_DEPTH) {
                return false;
              }

              final Path directory = path.subpath(BUILD_INDEX, TASK_INDEX);
              final Path fileName = path.getFileName();
              return directory.equals(RESULTS_DIRECTORY) && RESULT_FILE.matches(fileName);
            }

            private List<String> annotateFile(final Path file) {
              try {
                final DocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();
                final DocumentBuilder builder = factory.newDocumentBuilder();
                final Document document = builder.parse(file.toFile());
                return this.annotateFailures(file, document);
              } catch (final IOException | ParserConfigurationException | SAXException exception) {
                final String message = "%s could not be read: %s".formatted(file, exception.getMessage());
                final String annotation = "::warning title=Unreadable JUnit XML::%s".formatted(this.escapeData(message));
                return List.of(annotation);
              }
            }

            private List<String> annotateFailures(final Path file, final Document document) {
              final String task = ":%s:%s".formatted(file.getName(PROJECT_INDEX), file.getName(TASK_INDEX));
              final NodeList failures = document.getElementsByTagName(FAILURE_TAG);
              final List<String> annotations = new ArrayList<>();
              for (int i = 0; i < failures.getLength(); i++) {
                final Element failure = (Element) failures.item(i);
                final String annotation = this.annotate(task, failure);
                annotations.add(annotation);
              }

              return annotations;
            }

            private String annotate(final String task, final Element failure) {
              final Element testCase = (Element) failure.getParentNode();
              final String className = testCase.getAttribute(CLASS_ATTRIBUTE);
              final String title = "%s %s".formatted(task, className);

              final List<String> lines = new ArrayList<>();
              lines.add(testCase.getAttribute(NAME_ATTRIBUTE));
              this.findTestFrame(className, failure).ifPresent(lines::add);
              lines.add(this.findFirstMessageLine(failure));
              this.findFirstTraceLine(failure, SUPPRESSED_PREFIX).ifPresent(lines::add);
              this.findTopLevelCauseLine(failure).ifPresent(lines::add);

              final String message = String.join(LINE_SEPARATOR, lines);
              return "::error title=%s::%s".formatted(this.escapeProperty(title), this.escapeData(message));
            }

            private Optional<String> findTestFrame(final String className, final Element failure) {
              final String prefix = FRAME_PREFIX + className + MEMBER_SEPARATOR;
              return this.findFirstTraceLine(failure, prefix);
            }

            private Optional<String> findFirstTraceLine(final Element failure, final String prefix) {
              final String stackTrace = failure.getTextContent();
              return stackTrace
                .lines()
                .map(String::strip)
                .filter(line -> line.startsWith(prefix))
                .findFirst();
            }

            private String findFirstMessageLine(final Element failure) {
              final String message = failure.getAttribute(MESSAGE_ATTRIBUTE);
              final String text = message.isBlank() ? failure.getAttribute(TYPE_ATTRIBUTE) : message;
              return text.lines().findFirst().orElse("");
            }

            private Optional<String> findTopLevelCauseLine(final Element failure) {
              final String stackTrace = failure.getTextContent();
              // Java indents the causes of suppressed exceptions; the top-level cause starts its line.
              return stackTrace
                .lines()
                .filter(line -> line.startsWith(CAUSE_PREFIX))
                .findFirst();
            }

            private void printAnnotations(final List<Path> files, final List<String> annotations) {
              if (annotations.isEmpty()) {
                IO.println("::notice title=No failed test case::Read %s JUnit XML files and found no failed test case.".formatted(files.size()));
                return;
              }

              if (annotations.size() <= ANNOTATIONS_PER_STEP) {
                annotations.forEach(IO::println);
                return;
              }

              final int shown = ANNOTATIONS_PER_STEP - 1;
              final int leftOut = annotations.size() - shown;
              annotations.subList(0, shown).forEach(IO::println);
              IO.println("::error title=More failed test cases::%s more failed cases are left out: GitHub keeps %s error annotations per step.".formatted(leftOut, ANNOTATIONS_PER_STEP));
            }

            private String escapeData(final String text) {
              return text
                .replace("%", "%25")
                .replace("\r", "%0D")
                .replace("\n", "%0A");
            }

            private String escapeProperty(final String text) {
              final String data = this.escapeData(text);
              return data
                .replace(":", "%3A")
                .replace(",", "%2C");
            }
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore

      - name: Stage artifacts
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          cp mcav-plugin/build/libs/*-all.jar mcav-mod/build/libs/*-fabric.jar mcav-mod/build/libs/*-neoforge.jar dist/
          ls -la dist/

      - name: Upload build artifact
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: mcav-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Download every dependency for the dependency cache
        if: matrix.writes-dependencies && steps.dependencies.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/resolve-all.gradle" <<'EOF'
          import org.gradle.api.artifacts.component.ModuleComponentIdentifier

          allprojects { p ->
              def configurations = p.configurations
              def path = p.path
              p.tasks.register('resolveAllDependencies') {
                  doLast {
                      configurations.findAll { it.canBeResolved }.each { c ->
                          try {
                              c.incoming.artifactView {
                                  lenient = true
                                  componentFilter { it instanceof ModuleComponentIdentifier }
                              }.files.files
                          } catch (Exception e) {
                              logger.warn("resolveAllDependencies skipped ${path}:${c.name}: ${e.message}")
                          }
                      }
                  }
              }
          }
          EOF
          sh ./gradlew --console=plain --init-script "$RUNNER_TEMP/resolve-all.gradle" --continue resolveAllDependencies

      - name: Stop the Gradle daemon so that the dependency cache can read its lock file on Windows
        if: matrix.writes-dependencies && steps.dependencies.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: sh ./gradlew --stop

      - name: Save the Gradle dependency cache
        if: matrix.writes-dependencies && steps.dependencies.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/caches/modules-2
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  property:
    name: Property tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - *set-up-gradle

      - *compile-only-build-cache
      - *restore-dependencies

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb qemu-system-x86 qemu-utils libgtk2.0-0t64 mesa-utils libgl1-mesa-dri

      - name: Property tests
        shell: bash
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh ./gradlew --console=plain propertyTest -Pmcav.networkTests=true

      - *count-test-cases

      - *annotate-failed-test-cases

  jcstress:
    name: Concurrency tests ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1
            tests: '^me\.brandonli\.mcav\.(bukkit|capability|http)\..*'
          - name: 2
            tests: '^(?!me\.brandonli\.mcav\.(bukkit|capability|http)\.).*'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - *set-up-gradle

      - *compile-only-build-cache
      - *restore-dependencies

      # 8 of the 15 minutes for 5 of the 10 tests keeps each iteration at least as long as in one run of all
      - name: Concurrency tests
        timeout-minutes: 15
        shell: bash
        env:
          JCSTRESS_TESTS: ${{ matrix.tests }}
        run: sh ./gradlew --console=plain jcstressTest -Pjcstress.mode=quick -Pjcstress.timeBudgetMinutes=8 "-Pjcstress.tests=$JCSTRESS_TESTS"

  fuzz:
    name: Fuzz ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser-1
            tasks: :mcav-browser:fuzzTest
            shard: 1/3
          - name: browser-2
            tasks: :mcav-browser:fuzzTest
            shard: 2/3
          - name: browser-3
            tasks: :mcav-browser:fuzzTest
            shard: 3/3
          - name: bukkit-1
            tasks: :mcav-bukkit:fuzzTest
            shard: 1/4
          - name: bukkit-2
            tasks: :mcav-bukkit:fuzzTest
            shard: 2/4
          - name: bukkit-3
            tasks: :mcav-bukkit:fuzzTest
            shard: 3/4
          - name: bukkit-4
            tasks: :mcav-bukkit:fuzzTest
            shard: 4/4
          - name: common-1
            tasks: :mcav-common:fuzzTest
            shard: 1/3
          - name: common-2
            tasks: :mcav-common:fuzzTest
            shard: 2/3
          - name: common-3
            tasks: :mcav-common:fuzzTest
            shard: 3/3
          - name: mod-1
            tasks: :mcav-mod:fuzzTest
            shard: 1/2
          - name: mod-2
            tasks: :mcav-mod:fuzzTest
            shard: 2/2
          - name: plugin-1
            tasks: :mcav-plugin:fuzzTest
            shard: 1/2
          - name: plugin-2
            tasks: :mcav-plugin:fuzzTest
            shard: 2/2
          - name: other-1
            tasks: &other-fuzz-tasks >-
              fuzzTest -x :mcav-browser:fuzzTest -x :mcav-bukkit:fuzzTest -x :mcav-common:fuzzTest
              -x :mcav-mod:fuzzTest -x :mcav-plugin:fuzzTest
            shard: 1/2
          - name: other-2
            tasks: *other-fuzz-tasks
            shard: 2/2

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - *set-up-gradle

      - *compile-only-build-cache
      - *restore-dependencies

      - name: Fuzz tests
        timeout-minutes: 45
        shell: bash
        env:
          FUZZ_SHARD: ${{ matrix.shard }}
        run: |
          cat > "$RUNNER_TEMP/fuzz-shard.gradle" <<'EOF'
          def (index, count) = System.getenv('FUZZ_SHARD').tokenize('/')*.toInteger()
          def held = [] as Set
          gradle.taskGraph.whenReady { graph ->
              def targets = graph.allTasks.findAll { it instanceof Test && it.name ==~ /fuzz[A-Z]\w*/ && it.name != 'fuzzTest' }*.path.sort()
              targets.eachWithIndex { path, position -> if (position % count == index - 1) held << path }
              println "Fuzz shard $index of $count runs ${held.size()} of ${targets.size()} targets: ${held.join(' ')}"
          }
          allprojects {
              tasks.withType(Test).configureEach { task ->
                  if (task.name == 'fuzzTest') {
                      task.onlyIf('this is the last fuzz shard, which holds the fewest targets') { index == count }
                  } else if (task.name ==~ /fuzz[A-Z]\w*/) {
                      task.onlyIf('this fuzz shard holds the target') { held.contains(task.path) }
                  }
              }
          }
          EOF
          sh ./gradlew --console=plain --init-script "$RUNNER_TEMP/fuzz-shard.gradle" --no-parallel --continue ${{ matrix.tasks }} -Pfuzz.seconds=60

      - *count-test-cases

      - *annotate-failed-test-cases

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.name }}
          path: '*/build/jazzer/'
          if-no-files-found: ignore

  e2e:
    name: End-to-end test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - *set-up-gradle

      - *compile-only-build-cache
      - *restore-dependencies

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb qemu-system-x86 qemu-utils libgtk2.0-0t64 mesa-utils libgl1-mesa-dri \
            libva2 libva-drm2 libx11-xcb1 libxcb-shm0 libasound2t64 libpulse0 libsndfile1 libmp3lame0 \
            libmpg123-0t64 libvorbisenc2 libopus0 libvlc-dev libvlccore-dev vlc-plugin-base vlc-plugin-video-output

      - name: End-to-end test
        timeout-minutes: 60
        shell: bash
        run: sh ./gradlew --console=plain :mcav-plugin:e2eTest -Pmcav.e2e=true -Pmcav.acceptMinecraftEula=true

      - *count-test-cases

      - *annotate-failed-test-cases

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-e2e
          path: |
            mcav-plugin/build/reports/
            mcav-plugin/build/test-results/
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: [ build, property, jcstress, fuzz, e2e ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/rewrite' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mcav-*
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="$TAG - $COMMIT_SUBJECT"
            PRERELEASE=false
          else
            DATE=$(date -u +'%Y-%m-%d')
            TAG="build-${DATE}-${SHORT_SHA}"
            NAME="${DATE} - ${COMMIT_SUBJECT}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "name<<META_EOF"
            echo "$NAME"
            echo "META_EOF"
            echo "body<<META_EOF"
            echo "Automated build from commit \`$SHORT_SHA\` (${GITHUB_SHA})."
            echo ""
            echo "**$COMMIT_SUBJECT**"
            if [ -n "$COMMIT_BODY" ]; then
              echo ""
              echo "$COMMIT_BODY"
            fi
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
