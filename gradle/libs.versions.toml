# Every version the build uses: the libraries, the Gradle plugins, and the tools the build downloads or pins (the
# Java toolchain, Node.js and prettier for Spotless, PIT, the Checker Framework, the Paper dev bundle and the plugins
# the development server downloads). Build files name them as libs.<alias>; the convention plugins in buildSrc read
# them through the version catalog extension. Two versions cannot live here: the Gradle wrapper's (in
# gradle/wrapper/gradle-wrapper.properties) and the toolchain resolver plugin's in settings.gradle.kts, whose plugins
# block is evaluated before any version catalog exists.

[versions]
java = "25"
minecraft = "26.2"
paper = "26.2.build.+"
paperweight = "2.0.0-beta.24"
node = "24.21.0"
prettier = "3.9.9"
prettier-plugin-java = "2.11.0"
checker-framework = "3.53.1"
checker-framework-gradle = "1.0.2"
errorprone = "2.50.0"
errorprone-gradle = "5.1.1"
pitest = "1.30.0"
pitest-junit5-plugin = "1.2.3"
pitest-gradle = "1.19.0"
spotless = "8.10.3"
node-gradle = "7.1.0"
jacoco = "0.8.15"
junit = "6.1.3"
mockito = "5.24.0"
jqwik = "1.10.1"
jazzer = "0.30.0"
jcstress = "0.16"
guava = "33.7.1-jre"
gson = "2.14.0"
jna = "5.19.1"
slf4j = "2.0.20"
osgi-annotation = "8.1.0"
jimfs = "1.3.2"
vlcj = "4.12.1"
javacv = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
opencv = "4.14.0-1.5.14"
javacpp-platform-gradle = "1.5.10"
netty = "4.2.18.Final"
maven-resolver = "2.0.23"
jda = "6.7.0"
spring-boot = "4.1.1"
jcefmaven = "146.0.10"
xz = "1.12"
vernacular = "1.14"
lwjgl = "3.4.3"
voicechat-api = "2.6.24"
gremlin = "0.0.9"
cloud = "2.1.0"
cloud-minecraft = "2.0.1"
commodore = "2.2"
bstats = "3.2.1"
shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"
# the plugins the development server (./gradlew :sandbox:plugin:runServer) downloads
voicechat-plugin = "bukkit-2.6.24"
spark = "1.10.187"
spark-build = "539"

[libraries]
# build logic: the Gradle plugins the convention plugins in buildSrc apply
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
checker-framework-gradle = { module = "org.checkerframework:checker-framework-gradle-plugin", version.ref = "checker-framework-gradle" }
node-gradle = { module = "com.github.node-gradle:gradle-node-plugin", version.ref = "node-gradle" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle" }
pitest-gradle = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-gradle" }

# checks and tests
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# the libraries of the modules
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
