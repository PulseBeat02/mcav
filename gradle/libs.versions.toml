jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
vernacular = { module = "com.shinyhut:vernacular", version.ref = "vernacular" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
