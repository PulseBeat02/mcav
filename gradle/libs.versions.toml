# Every version the build uses: the libraries, the Gradle plugins, and the tools the build downloads or pins (the Java
# toolchain, Node.js and prettier for Spotless, PIT, the Checker Framework, the Paper dev bundle, clang-format for the
# MCV2 natives, and the plugins the development server downloads). Build scripts name them as libs.<alias>; the
# convention plugins in buildSrc look them up by alias. Three versions live elsewhere because they must: the Gradle
# wrapper's (gradle/wrapper/gradle-wrapper.properties), the toolchain resolver plugin's (the plugins block of
# settings.gradle.kts runs before any version catalog exists), and Zig's for the MCV2 natives (their build.sh, which the
# natives' SOURCES manifest hashes).

[versions]
java = "25"
minecraft = "26.3"
# Paper 26.3 has only alpha builds (2026-09-27); the newest is pinned
paper = "26.3.build.49-alpha"
paperweight = "2.0.0-beta.24"
node = "24.21.0"
prettier = "3.9.9"
prettier-plugin-java = "2.11.0"
clang-format = "18.1.8"
checker-framework = "4.2.3"
checker-framework-gradle = "1.0.2"
errorprone = "2.50.0"
errorprone-gradle = "5.1.1"
pitest = "1.30.0"
pitest-junit5-plugin = "1.2.3"
pitest-gradle = "1.19.0"
spotless = "8.10.3"
node-gradle = "7.1.0"
jacoco = "0.8.15"
junit = "6.1.3"
mockito = "5.24.0"
jqwik = "1.10.1"
jazzer = "0.30.0"
jcstress = "0.16"
guava = "33.7.1-jre"
gson = "2.14.0"
jna = "5.19.1"
slf4j = "2.0.20"
osgi-annotation = "8.1.0"
jimfs = "1.3.2"
vlcj = "4.12.1"
javacv = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
opencv = "4.14.0-1.5.14"
javacpp-platform-gradle = "1.5.10"
netty = "4.2.18.Final"
maven-resolver = "2.0.23"
jda = "6.7.0"
spring-boot = "4.1.1"
# Spring Boot 4.1.1 brings Tomcat 11.0.24, Jackson 3.1.5 and JDA Jackson 2.22.2, all with known vulnerabilities; the
# releases that fix them, pinned as constraints by mcav-http and mcav-jda until those bring them themselves
tomcat = "11.0.25"
jackson = "3.1.7"
jackson2 = "2.22.3"
jcefmaven = "152.0.6"
xz = "1.12"
vernacular = "1.14"
lwjgl = "3.4.3"
voicechat-api = "2.6.24"
gremlin = "0.0.9"
cloud = "2.1.0"
cloud-minecraft = "2.0.1"
commodore = "2.2"
bstats = "3.2.1"
shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"
# the plugins the development server (./gradlew :sandbox:plugin:runServer) downloads
voicechat-plugin = "bukkit-2.6.24"
spark = "1.10.187"
spark-build = "539"
# the MCV2 client mod (mcav-mcv2-client): Minecraft 26.3's client jar, named by its SHA-1 on Mojang's download server,
# the loaders and APIs it is built against, and the libraries the client loads with it, as 26.3's version manifest names
# them (client-*: a minecraft-* name would turn the version alias minecraft above into a group)
client-jar = "e877b6a07acd633fb3bb475002175cec036e7b87"
fabric-loader = "0.19.5"
fabric-api-base = "2.0.6+fcdff87f5d"
fabric-networking-api = "6.3.8+fcdff87f5d"
fabric-lifecycle-events = "4.1.9+ffef5f675d"
neoforge-core = "26.3.0.43-beta"
neoforge-loader = "12.0.8"
neoforge-bus = "8.0.5"
neoforge-mergetool = "2.0.7"
iris = "1.11.7+26.3-fabric"
client-netty = "4.2.16.Final"
client-brigadier = "1.3.11"
client-datafixerupper = "10.0.21"
client-authlib = "10.0.77"
client-logging = "1.7.12"
client-fastutil = "8.5.18"
client-joml = "1.10.9"
client-commons-lang3 = "3.20.0"
client-log4j = "2.26.0"
client-guava = "33.6.0-jre"
client-slf4j = "2.0.17"
client-jspecify = "1.0.0"

