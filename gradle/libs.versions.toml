# the sandbox plugin
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
gremlin-runtime = { module = "xyz.jpenilla:gremlin-runtime", version.ref = "gremlin" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-minecraft" }
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-minecraft" }
commodore = { module = "me.lucko:commodore", version.ref = "commodore" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

# the MCV2 client mod; NeoForge's own jar is its "universal" one and mergetool's the "api" one, chosen in the build script
minecraft-client = { module = "net.minecraft:client", version.ref = "client-jar" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api-base = { module = "net.fabricmc.fabric-api:fabric-api-base", version.ref = "fabric-api-base" }
fabric-networking-api = { module = "net.fabricmc.fabric-api:fabric-networking-api-v1", version.ref = "fabric-networking-api" }
fabric-lifecycle-events = { module = "net.fabricmc.fabric-api:fabric-lifecycle-events-v1", version.ref = "fabric-lifecycle-events" }
neoforge-core = { module = "net.neoforged:neoforge", version.ref = "neoforge-core" }
neoforge-loader = { module = "net.neoforged.fancymodloader:loader", version.ref = "neoforge-loader" }
neoforge-bus = { module = "net.neoforged:bus", version.ref = "neoforge-bus" }
neoforge-mergetool = { module = "net.neoforged:mergetool", version.ref = "neoforge-mergetool" }
iris = { module = "maven.modrinth:iris", version.ref = "iris" }
minecraft-netty-buffer = { module = "io.netty:netty-buffer", version.ref = "client-netty" }
minecraft-netty-common = { module = "io.netty:netty-common", version.ref = "client-netty" }
minecraft-netty-transport = { module = "io.netty:netty-transport", version.ref = "client-netty" }
minecraft-netty-codec-base = { module = "io.netty:netty-codec-base", version.ref = "client-netty" }
minecraft-brigadier = { module = "com.mojang:brigadier", version.ref = "client-brigadier" }
minecraft-datafixerupper = { module = "com.mojang:datafixerupper", version.ref = "client-datafixerupper" }
minecraft-authlib = { module = "com.mojang:authlib", version.ref = "client-authlib" }
minecraft-logging = { module = "com.mojang:logging", version.ref = "client-logging" }
minecraft-fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "client-fastutil" }
minecraft-joml = { module = "org.joml:joml", version.ref = "client-joml" }
minecraft-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "client-commons-lang3" }
minecraft-log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "client-log4j" }
minecraft-guava = { module = "com.google.guava:guava", version.ref = "client-guava" }
minecraft-slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "client-slf4j" }
minecraft-jspecify = { module = "org.jspecify:jspecify", version.ref = "client-jspecify" }

[bundles]
testing = ["junit-jupiter", "mockito-core", "mockito-junit-jupiter", "jqwik", "jazzer-junit"]
jna = ["jna", "jna-platform"]
spring-boot-web = ["spring-boot-starter-web", "spring-boot-starter-websocket"]
# the Java classes of JavaCV and its FFmpeg and OpenCV presets, without the native libraries of every platform
javacv-classes = ["javacv", "javacpp", "ffmpeg", "opencv"]
lwjgl-opengl = ["lwjgl", "lwjgl-opengl"]
cloud = ["cloud-core", "cloud-annotations", "cloud-paper", "cloud-minecraft-extras"]
# what the MCV2 client mod compiles against, besides NeoForge's and mergetool's jars: the client, the loaders, their
# APIs and Iris, with the libraries their signatures name, and SLF4J, which the repository's Checker Framework stubs name
mcv2-client = [
    "minecraft-client",
    "fabric-loader",
    "fabric-api-base",
    "fabric-networking-api",
    "fabric-lifecycle-events",
    "neoforge-loader",
    "neoforge-bus",
    "iris",
    "minecraft-netty-buffer",
    "minecraft-netty-common",
    "minecraft-jspecify",
    "minecraft-slf4j-api",
]
# the rest of the libraries the client's own classes load, which the tests of the mod create and mock
minecraft-client-libraries = [
    "minecraft-netty-transport",
    "minecraft-netty-codec-base",
    "minecraft-brigadier",
    "minecraft-datafixerupper",
    "minecraft-authlib",
    "minecraft-logging",
    "minecraft-fastutil",
    "minecraft-joml",
    "minecraft-commons-lang3",
    "minecraft-log4j-api",
    "minecraft-guava",
    "gson",
]

[plugins]
# applied by the convention plugins in buildSrc, which put them on the build's class path
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
checker-framework = { id = "org.checkerframework", version.ref = "checker-framework-gradle" }
node = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
gremlin = { id = "xyz.jpenilla.gremlin-gradle", version.ref = "gremlin" }
javacpp-platform = { id = "org.bytedeco.gradle-javacpp-platform", version.ref = "javacpp-platform-gradle" }
# applied by mcav-bukkit alone
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
