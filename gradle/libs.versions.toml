# Every version the build uses: the libraries, the Gradle plugins, and the tools the build downloads or pins (the Java
# toolchain, Node.js and prettier for Spotless, PIT, the Checker Framework, the Paper dev bundle, clang-format for the
# MCV2 natives, and the plugins the development server downloads). Build scripts name them as libs.<alias>; the
# convention plugins in buildSrc look them up by alias. Three versions live elsewhere because they must: the Gradle
# wrapper's (gradle/wrapper/gradle-wrapper.properties), the toolchain resolver plugin's (the plugins block of
# settings.gradle.kts runs before any version catalog exists), and Zig's for the MCV2 natives (their build.sh, which the
# natives' SOURCES manifest hashes).

[versions]
java = "25"
minecraft = "26.3"
# Paper 26.3 has only alpha builds (2026-09-27); the newest is pinned
paper = "26.3.build.49-alpha"
paperweight = "2.0.0-beta.24"
node = "24.21.0"
prettier = "3.9.9"
prettier-plugin-java = "2.11.0"
clang-format = "18.1.8"
checker-framework = "4.2.3"
checker-framework-gradle = "1.0.2"
errorprone = "2.50.0"
errorprone-gradle = "5.1.1"
pitest = "1.30.0"
pitest-junit5-plugin = "1.2.3"
pitest-gradle = "1.19.0"
spotless = "8.10.3"
node-gradle = "7.1.0"
jacoco = "0.8.15"
junit = "6.1.3"
mockito = "5.24.0"
jqwik = "1.10.1"
jazzer = "0.30.0"
jcstress = "0.16"
guava = "33.7.1-jre"
gson = "2.14.0"
jna = "5.19.1"
slf4j = "2.0.20"
osgi-annotation = "8.1.0"
jimfs = "1.3.2"
vlcj = "4.12.1"
javacv = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
opencv = "4.14.0-1.5.14"
javacpp-platform-gradle = "1.5.10"
netty = "4.2.18.Final"
maven-resolver = "2.0.23"
jda = "6.7.0"
spring-boot = "4.1.1"
jcefmaven = "146.0.10"
xz = "1.12"
vernacular = "1.14"
lwjgl = "3.4.3"
voicechat-api = "2.6.24"
gremlin = "0.0.9"
cloud = "2.1.0"
cloud-minecraft = "2.0.1"
commodore = "2.2"
bstats = "3.2.1"
shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"
# the plugins the development server (./gradlew :sandbox:plugin:runServer) downloads
voicechat-plugin = "bukkit-2.6.24"
spark = "1.10.187"
spark-build = "539"

[libraries]
# checks and tests
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# the libraries of the modules
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
osgi-annotation = { module = "org.osgi:osgi.annotation", version.ref = "osgi-annotation" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
javacv-platform = { module = "org.bytedeco:javacv-platform", version.ref = "javacv" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacv" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
opencv = { module = "org.bytedeco:opencv", version.ref = "opencv" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
maven-resolver-supplier = { module = "org.apache.maven.resolver:maven-resolver-supplier-mvn3", version.ref = "maven-resolver" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket", version.ref = "spring-boot" }
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
vernacular = { module = "com.shinyhut:vernacular", version.ref = "vernacular" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl" }
voicechat-api = { module = "de.maxhenkel.voicechat:voicechat-api", version.ref = "voicechat-api" }

# the sandbox plugin
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
gremlin-runtime = { module = "xyz.jpenilla:gremlin-runtime", version.ref = "gremlin" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-minecraft" }
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-minecraft" }
commodore = { module = "me.lucko:commodore", version.ref = "commodore" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

[bundles]
testing = ["junit-jupiter", "mockito-core", "mockito-junit-jupiter", "jqwik", "jazzer-junit"]
jna = ["jna", "jna-platform"]
spring-boot-web = ["spring-boot-starter-web", "spring-boot-starter-websocket"]
# the Java classes of JavaCV and its FFmpeg and OpenCV presets, without the native libraries of every platform
javacv-classes = ["javacv", "javacpp", "ffmpeg", "opencv"]
lwjgl-opengl = ["lwjgl", "lwjgl-opengl"]
cloud = ["cloud-core", "cloud-annotations", "cloud-paper", "cloud-minecraft-extras"]

[plugins]
# applied by the convention plugins in buildSrc, which put them on the build's class path
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
checker-framework = { id = "org.checkerframework", version.ref = "checker-framework-gradle" }
node = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
gremlin = { id = "xyz.jpenilla.gremlin-gradle", version.ref = "gremlin" }
javacpp-platform = { id = "org.bytedeco.gradle-javacpp-platform", version.ref = "javacpp-platform-gradle" }
# applied by mcav-bukkit alone
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
