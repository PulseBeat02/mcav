# the libraries of the modules
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
osgi-annotation = { module = "org.osgi:osgi.annotation", version.ref = "osgi-annotation" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
javacv-platform = { module = "org.bytedeco:javacv-platform", version.ref = "javacv" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacv" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
opencv = { module = "org.bytedeco:opencv", version.ref = "opencv" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
